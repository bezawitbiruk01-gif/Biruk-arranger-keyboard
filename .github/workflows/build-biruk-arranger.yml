name: Build Biruk Arranger APK

on:
  workflow_dispatch:
  push:
    paths:
      - "arranger-pro (1).zip"
      - ".github/workflows/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Extract project
        run: |
          rm -rf build-project
          mkdir build-project
          unzip -q "arranger-pro (1).zip" -d build-project
          test -f build-project/settings.gradle.kts
          test -f build-project/app/build.gradle.kts

      - name: Remove CI-incompatible custom signing
        working-directory: build-project
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          start = s.find("  signingConfigs {")
          if start != -1:
              end = s.find("\n  buildTypes {", start)
              if end == -1:
                  raise SystemExit("Could not locate buildTypes after signingConfigs")
              s = s[:start] + s[end:]
          s = s.replace('      signingConfig = signingConfigs.getByName("release")\n', '')
          s = s.replace('    debug { signingConfig = signingConfigs.getByName("debugConfig") }\n', '')
          p.write_text(s)
          PY

      - name: Build debug APK
        working-directory: build-project
        run: |
          gradle --no-daemon --stacktrace --warning-mode all assembleDebug

      - name: Run unit tests
        working-directory: build-project
        run: |
          gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Collect APK
        run: |
          mkdir -p artifacts
          cp build-project/app/build/outputs/apk/debug/app-debug.apk artifacts/Biruk-Arranger-debug.apk
          sha256sum artifacts/Biruk-Arranger-debug.apk | tee artifacts/SHA256SUM.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Biruk-Arranger-debug-apk
          path: artifacts/
          if-no-files-found: error

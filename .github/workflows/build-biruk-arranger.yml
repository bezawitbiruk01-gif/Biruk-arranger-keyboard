name: Build Biruk Arranger APK

on:
  push:
    paths:
      - "arranger-pro (1).zip"
      - "fix_source.py"
      - ".github/workflows/build-biruk-arranger.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.3.1"

      - name: Extract source
        run: |
          rm -rf build-project
          mkdir -p build-project
          unzip -q "arranger-pro (1).zip" -d build-project

      - name: Apply verified source fixes
        run: |
          python3 fix_source.py build-project

      - name: Build debug APK
        working-directory: build-project
        run: |
          gradle --no-daemon --stacktrace --warning-mode all assembleDebug

      - name: Run unit tests
        working-directory: build-project
        run: |
          gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Package verified APK
        run: |
          mkdir -p artifacts
          cp build-project/app/build/outputs/apk/debug/app-debug.apk artifacts/Biruk-Arranger-debug.apk
          sha256sum artifacts/Biruk-Arranger-debug.apk > artifacts/SHA256SUM.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Biruk-Arranger-debug-apk
          path: artifacts/
          if-no-files-found: error
